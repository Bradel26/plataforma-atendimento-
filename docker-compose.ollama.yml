# IA local opcional, independente dos outros servicos de desenvolvimento.
# Uso: docker compose -f docker-compose.ollama.yml up -d
# Modelo: docker compose -f docker-compose.ollama.yml exec ollama ollama pull qwen3:4b
name: plataforma-ia-local

services:
  ollama:
    image: ollama/ollama
    environment:
      OLLAMA_NO_CLOUD: "1"
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-modelos:/root/.ollama

volumes:
  ollama-modelos:
    name: bradel-local-ollama-modelos
