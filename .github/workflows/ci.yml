name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # O client do Prisma e gerado, nao versionado: sem isto o typecheck nao
      # encontra os tipos dos modelos.
      - run: npm run db:generate --workspace @plataforma/api

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      # Os smoke tests (`npm run smoke:*`) exigem Postgres, Redis e a API de pe,
      # entao ficam fora do CI: rodam no ambiente de desenvolvimento. O que roda
      # aqui e a suite de unidade, que nao precisa de infraestrutura.

  # Deploy automatico por acao, e nao pelo webhook nativo do Coolify.
  #
  # O webhook do GitHub para o recurso do Coolify nao dispara: tres pushes
  # consecutivos (df5ffc5, fb07715, 4ec9f6e) foram acompanhados com zero trocas
  # de container, e o Deploy manual funcionou nas tres vezes. Em vez de insistir
  # no gatilho quebrado, a acao chama a API do Coolify diretamente.
  #
  # Ganho de lado: `needs: verificar` significa que o deploy so acontece com a
  # suite verde. O webhook nativo subiria qualquer commit, inclusive um que nao
  # compila.
  implantar:
    needs: verificar
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      COOLIFY_URL: ${{ vars.COOLIFY_URL || 'https://coolify.bradel.com.br' }}
      COOLIFY_UUID: ${{ vars.COOLIFY_UUID || 'zios6of26x7kizkh57fxw62t' }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      PRODUCAO: ${{ vars.PRODUCAO_URL || 'https://zios6of26x7kizkh57fxw62t.187.127.32.153.sslip.io' }}
    steps:
      - name: Disparar o deploy e aguardar o resultado
        run: |
          set -euo pipefail

          # Sem o segredo, avisa em vez de falhar: um X vermelho em todo push
          # antes de o token existir ensina a ignorar o resultado da acao.
          if [ -z "${COOLIFY_TOKEN}" ]; then
            echo "::warning title=Deploy nao disparado::O segredo COOLIFY_TOKEN nao esta configurado. O deploy continua manual. Veja COOLIFY.md secao 8."
            exit 0
          fi

          # Sem --fail-with-body de proposito: com `set -e`, o curl morreria com
          # "curl: (22) error 401" e nada mais, escondendo qual das causas foi.
          # Capturando o codigo, cada uma ganha a mensagem do seu conserto.
          http=$(curl -sS -o resposta.json -w '%{http_code}' \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            "${COOLIFY_URL}/api/v1/deploy?uuid=${COOLIFY_UUID}&force=false" || echo 000)
          resposta=$(cat resposta.json 2>/dev/null || echo '{}')
          echo "HTTP ${http} — ${resposta}"

          case "${http}" in
            200|201)
              ;;
            401)
              echo "::error title=Token invalido::O Coolify nao reconheceu o COOLIFY_TOKEN. Crie outro em Keys & Tokens > API Tokens (permissoes deploy + read), copie com Ctrl+C da tela e atualize o segredo no GitHub. Nao transcreva de print: os caracteres O/0 e 1/l/I se confundem."
              exit 1
              ;;
            403)
              echo "::error title=Token sem permissao::O token existe mas nao pode implantar. Ele precisa das permissoes deploy e read juntas — marcar uma desmarca a outra na tela do Coolify, confira a coluna PERMISSIONS em Issued Tokens."
              exit 1
              ;;
            404)
              echo "::error title=Recurso nao encontrado::UUID ${COOLIFY_UUID} nao existe. Abra o recurso no Coolify e pegue o UUID da barra de endereco, depois crie a variable COOLIFY_UUID (variable, nao secret) com o valor certo."
              exit 1
              ;;
            000)
              echo "::error title=Coolify inalcancavel::Nao houve resposta de ${COOLIFY_URL}. O painel pode estar fora."
              exit 1
              ;;
            *)
              echo "::error title=Coolify recusou o disparo::HTTP ${http}. Corpo acima."
              exit 1
              ;;
          esac

          implantacao=$(echo "${resposta}" | jq -r '.deployments[0].deployment_uuid // empty')
          if [ -z "${implantacao}" ]; then
            echo "::error title=Deploy nao iniciou::A API aceitou a chamada mas nao devolveu deployment_uuid."
            exit 1
          fi
          echo "implantacao ${implantacao} — acompanhando"

          # Espera ativa com teto. 20 minutos cobre com folga o build observado
          # (1m45s a 2m11s) mais o rolling update (6s a 8s); o teto existe para
          # a acao nao ficar pendurada se o Coolify travar sem concluir.
          for tentativa in $(seq 1 80); do
            sleep 15
            estado=$(curl -sS -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
              "${COOLIFY_URL}/api/v1/deployments/${implantacao}" | jq -r '.status // "desconhecido"')
            echo "  [${tentativa}] ${estado}"
            case "${estado}" in
              finished)
                echo "deploy concluido"
                exit 0
                ;;
              failed|cancelled-by-user)
                echo "::error title=Deploy falhou::Estado final ${estado}. Veja o log em ${COOLIFY_URL}."
                exit 1
                ;;
            esac
          done

          echo "::error title=Deploy sem conclusao::20 minutos sem estado final. Confira o log no Coolify."
          exit 1

      # Um deploy que a API declara concluido, mas que subiu um container que nao
      # atende, nao esta concluido. O health confere as tres dependencias.
      - name: Conferir a producao depois do deploy
        if: env.COOLIFY_TOKEN != ''
        run: |
          set -euo pipefail
          saude=$(curl -sS --retry 6 --retry-delay 10 --retry-all-errors "${PRODUCAO}/api/health")
          echo "${saude}"
          echo "${saude}" | jq -e '.status == "ok" and .dependencias.postgres == "ok" and .dependencias.redis == "ok"'
