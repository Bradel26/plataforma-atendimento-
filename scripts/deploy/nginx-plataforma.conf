# Nginx da plataforma numa VPS (sem Docker).
#
# Instale em /etc/nginx/sites-available/plataforma e ligue com:
#   ln -s /etc/nginx/sites-available/plataforma /etc/nginx/sites-enabled/plataforma
#   rm -f /etc/nginx/sites-enabled/default
#   nginx -t && systemctl reload nginx
#
# O bloco de HTTPS (listen 443, certificados) e escrito pelo certbot. Comece com
# este arquivo em HTTP, rode o certbot, e ele reescreve o resto.
server {
  listen 80;
  listen [::]:80;
  server_name SEU_DOMINIO;

  # Front compilado (apps/web/dist copiado para ca pelo publicar.sh).
  root /var/www/plataforma;
  index index.html;

  # SPA: qualquer rota desconhecida devolve o index e o React resolve o caminho.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # O Webchat e carregado num iframe dentro do site do cliente (widget.js), entao
  # esta rota NAO pode receber X-Frame-Options: DENY nem frame-ancestors 'self'.
  location /webchat {
    try_files $uri /index.html;
  }

  # O bundle tem hash no nome; o index nunca pode ser cacheado, senao o usuario
  # fica preso numa versao antiga apontando para arquivos que nao existem mais.
  location = /index.html {
    add_header Cache-Control "no-store";
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /api/ {
    proxy_pass http://127.0.0.1:3333;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Upload de anexo: o limite real e o UPLOAD_MAX_MB da API, com folga aqui.
    client_max_body_size 25m;
  }

  # WebSocket do atendimento em tempo real precisa do upgrade explicito.
  location /socket.io/ {
    proxy_pass http://127.0.0.1:3333;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 1h;
  }
}
