<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#172554" flood-opacity=".08"/></filter>
    <style>
      .font{font-family:Inter,Arial,sans-serif}.nav{font-size:13px;fill:#cbd5e1}.small{font-size:11px;fill:#64748b}.label{font-size:12px;fill:#64748b}.body{font-size:13px;fill:#0f172a}.muted{fill:#64748b}.title{font-size:20px;font-weight:650;fill:#0f172a}.white{fill:#fff}.card{fill:#fff;stroke:#dbe4f0}.line{stroke:#e8edf5}.blue{fill:#2563eb}.green{fill:#059669}.red{fill:#dc2626}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#f1f5f9"/>
  <!-- Navegação -->
  <rect width="216" height="1000" fill="#0f172a"/>
  <rect x="18" y="18" width="34" height="34" rx="9" fill="#2563eb"/><text x="35" y="41" text-anchor="middle" class="font white" font-size="16" font-weight="700">B</text>
  <text x="64" y="39" class="font white" font-size="13" font-weight="600">Plataforma Bradel</text>
  <g class="font nav">
    <text x="24" y="104">▦</text><text x="52" y="104">Dashboards</text>
    <text x="24" y="151">◉</text><text x="52" y="151">Atendimento</text>
    <rect x="10" y="169" width="196" height="38" rx="11" fill="#1e3a70"/><rect x="10" y="169" width="3" height="38" rx="2" fill="#3b82f6"/>
    <text x="24" y="194" fill="#fff">☎</text><text x="52" y="194" fill="#fff" font-weight="600">Telefonia</text>
    <text x="24" y="241">♧</text><text x="52" y="241">CRM</text>
    <text x="24" y="288">⚙</text><text x="52" y="288">Configurações</text>
  </g>
  <!-- Barra superior -->
  <rect x="216" width="1384" height="66" fill="#fff"/><line x1="216" y1="66" x2="1600" y2="66" stroke="#e2e8f0"/>
  <text x="244" y="41" class="font title">Telefonia</text>
  <circle cx="1281" cy="33" r="5" fill="#10b981"/><rect x="1294" y="17" width="137" height="32" rx="16" fill="#fff" stroke="#dbe4f0"/><text x="1311" y="38" class="font body">Disponível⌄</text>
  <text x="1450" y="29" class="font body">Kauã Tavares</text><text x="1450" y="45" class="font small">Administrador</text><circle cx="1552" cy="33" r="17" fill="#2563eb"/><text x="1552" y="38" text-anchor="middle" class="font white" font-size="12" font-weight="700">K</text>

  <!-- Área de conteúdo -->
  <text x="244" y="105" class="font title">Chamadas</text><text x="244" y="126" class="font small">Atenda pelo navegador e mantenha o histórico no cadastro do cliente.</text>
  <!-- Coluna principal -->
  <g filter="url(#shadow)">
    <rect x="236" y="150" width="930" height="110" rx="14" class="card"/>
    <rect x="236" y="278" width="292" height="92" rx="14" class="card"/>
    <rect x="546" y="278" width="292" height="92" rx="14" class="card"/>
    <rect x="856" y="278" width="310" height="92" rx="14" class="card"/>
    <rect x="236" y="388" width="930" height="540" rx="14" class="card"/>
  </g>
  <text x="258" y="180" class="font body" font-weight="650">Linha conectada</text>
  <circle cx="266" cy="212" r="5" fill="#10b981"/><text x="280" y="216" class="font body">WhatsApp Business · conectado à Cloud API</text>
  <text x="258" y="240" class="font small">A disponibilidade da linha e as chamadas do navegador aparecem aqui.</text>
  <text x="258" y="311" class="font label">CHAMADAS HOJE</text><text x="258" y="345" class="font" font-size="24" font-weight="650" fill="#0f172a">2</text><text x="290" y="345" class="font small">recebidas</text>
  <text x="568" y="311" class="font label">ATENDIDAS</text><text x="568" y="345" class="font" font-size="24" font-weight="650" fill="#0f172a">1</text><text x="590" y="345" class="font small">por você e sua equipe</text>
  <text x="878" y="311" class="font label">TEMPO MÉDIO</text><text x="878" y="345" class="font" font-size="24" font-weight="650" fill="#0f172a">04:32</text><text x="960" y="345" class="font small">por ligação atendida</text>

