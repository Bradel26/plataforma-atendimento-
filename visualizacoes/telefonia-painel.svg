  <rect x="1208" y="710" width="344" height="45" rx="9" fill="#fff" stroke="#cbd5e1"/><text x="1224" y="738" class="font" font-size="15" fill="#94a3b8">Digite um número ou busque um contato</text>
  <g class="font body" text-anchor="middle" font-size="14">
    <rect x="1208" y="769" width="104" height="39" rx="8" fill="#f8fafc" stroke="#e2e8f0"/><text x="1260" y="794">1</text>
    <rect x="1324" y="769" width="104" height="39" rx="8" fill="#f8fafc" stroke="#e2e8f0"/><text x="1376" y="794">2</text>
