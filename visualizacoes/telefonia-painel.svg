  <rect x="1368" y="414" width="160" height="46" rx="11" fill="#fff" stroke="#fecaca"/><text x="1448" y="442" text-anchor="middle" class="font red" font-size="13" font-weight="600">Recusar</text>

  <text x="1208" y="522" class="font label" font-weight="600">DURANTE A LIGAÇÃO</text>
  <rect x="1208" y="538" width="344" height="122" rx="12" fill="#f8fafc" stroke="#dbe4f0"/>
  <circle cx="1235" cy="568" r="5" fill="#10b981"/><text x="1250" y="572" class="font body" font-weight="600">Ligação em andamento</text><text x="1528" y="572" text-anchor="end" class="font" font-size="15" font-weight="650" fill="#0f172a">04:32</text>
  <text x="1224" y="596" class="font small">Mariana Oliveira · WhatsApp</text>
  <rect x="1224" y="612" width="89" height="31" rx="8" fill="#fff" stroke="#dbe4f0"/><text x="1268" y="632" text-anchor="middle" class="font small">◉ Silenciar</text>
  <rect x="1322" y="612" width="89" height="31" rx="8" fill="#fff" stroke="#dbe4f0"/><text x="1366" y="632" text-anchor="middle" class="font small">▦ Teclado</text>
  <rect x="1420" y="612" width="112" height="31" rx="8" fill="#fee2e2"/><text x="1476" y="632" text-anchor="middle" class="font red" font-size="11" font-weight="600">Desligar</text>

