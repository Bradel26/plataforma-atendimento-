  <text x="304" y="549" class="font body">Hoje, 16:31</text><text x="304" y="568" class="font small">WhatsApp</text>
  <text x="414" y="557" class="font body">Mariana Oliveira</text><text x="620" y="557" class="font body">Recebida</text>
  <rect x="728" y="539" width="94" height="25" rx="12" fill="#dcfce7"/><text x="775" y="556" text-anchor="middle" class="font green" font-size="11">Atendida</text>
  <text x="876" y="557" class="font body">04:32</text><text x="1000" y="557" class="font blue" font-size="12">▶ Ouvir</text>
  <line x1="258" y1="587" x2="1144" y2="587" class="line"/>
  <circle cx="276" cy="621" r="16" fill="#f1f5f9"/><text x="276" y="626" text-anchor="middle" class="font muted" font-size="11" font-weight="700">R</text>
  <text x="304" y="617" class="font body">Hoje, 16:22</text><text x="304" y="636" class="font small">WhatsApp</text>
  <text x="414" y="625" class="font body">Rafael Costa</text><text x="620" y="625" class="font body">Recebida</text>
  <rect x="728" y="607" width="94" height="25" rx="12" fill="#fef3c7"/><text x="775" y="624" text-anchor="middle" class="font" font-size="11" fill="#b45309">Não atendida</text>
  <text x="876" y="625" class="font body">—</text><text x="1000" y="625" class="font small">—</text>
  <line x1="258" y1="655" x2="1144" y2="655" class="line"/>
  <text x="260" y="696" class="font small">Ao encerrar, o registro, duração e gravação ficam disponíveis no histórico do contato.</text>

