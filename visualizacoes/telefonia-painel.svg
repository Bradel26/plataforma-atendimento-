  <text x="1208" y="182" class="font" font-size="16" font-weight="650" fill="#0f172a">Painel de ligações</text><circle cx="1534" cy="176" r="4" fill="#10b981"/><text x="1547" y="180" text-anchor="end" class="font small">Pronto</text>
  <line x1="1208" y1="201" x2="1552" y2="201" class="line"/>
  <rect x="1208" y="216" width="164" height="34" rx="9" fill="#eff6ff"/><text x="1290" y="238" text-anchor="middle" class="font blue" font-size="12" font-weight="600">Receber chamadas</text>
  <text x="1460" y="238" text-anchor="middle" class="font small">Fazer chamada</text>
  <text x="1208" y="280" class="font label" font-weight="600">CHAMADA RECEBIDA</text>
  <rect x="1208" y="296" width="344" height="190" rx="12" fill="#f8fafc" stroke="#dbe4f0"/>
  <circle cx="1247" cy="337" r="22" fill="#dbeafe"/><text x="1247" y="342" text-anchor="middle" class="font blue" font-size="13" font-weight="700">MO</text>
  <text x="1282" y="331" class="font body" font-weight="650">Mariana Oliveira</text><text x="1282" y="352" class="font small">WhatsApp · +55 (62) 9•••-••21</text>
  <circle cx="1223" cy="383" r="4" fill="#f59e0b"/><text x="1235" y="387" class="font" font-size="12" fill="#b45309">Chamando você…</text>
