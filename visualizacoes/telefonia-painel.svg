    <rect x="1208" y="817" width="104" height="39" rx="8" fill="#f8fafc" stroke="#e2e8f0"/><text x="1260" y="842">4</text>
    <rect x="1324" y="817" width="104" height="39" rx="8" fill="#f8fafc" stroke="#e2e8f0"/><text x="1376" y="842">5</text>
    <rect x="1440" y="817" width="112" height="39" rx="8" fill="#f8fafc" stroke="#e2e8f0"/><text x="1496" y="842">6</text>
    <rect x="1208" y="865" width="104" height="39" rx="8" fill="#f8fafc" stroke="#e2e8f0"/><text x="1260" y="890">7</text>
    <rect x="1324" y="865" width="104" height="39" rx="8" fill="#f8fafc" stroke="#e2e8f0"/><text x="1376" y="890">8</text>
    <rect x="1440" y="865" width="112" height="39" rx="8" fill="#f8fafc" stroke="#e2e8f0"/><text x="1496" y="890">9</text>
  </g>
  <text x="1390" y="918" text-anchor="middle" class="font small">PROPOSTA VISUAL · chamada ativa depende da integração Cloud API</text>
