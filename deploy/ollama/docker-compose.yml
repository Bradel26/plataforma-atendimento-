# Ollama privado para as consultas do CRM e a analise de chamadas.
# Conecte o container da API a esta mesma rede e configure CRM_IA_OLLAMA_URL
# / LIGACAO_IA_OLLAMA_URL como http://ollama:11434.
services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_HOST: "0.0.0.0:11434"
    expose:
      - "11434"
    volumes:
      - modelos-ollama:/root/.ollama
    networks:
      ia-interna:
        aliases:
          - ollama

volumes:
  modelos-ollama:

networks:
  ia-interna:
    name: bradel-ia-interna
    external: true
