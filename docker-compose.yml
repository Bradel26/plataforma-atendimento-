# Infra de desenvolvimento local (Fase 0).
# Sobe apenas as dependencias de dados; api e web rodam no host via `npm run dev`.
services:
  postgres:
    image: postgres:16-alpine
    container_name: plataforma-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: plataforma
      POSTGRES_PASSWORD: plataforma
      POSTGRES_DB: plataforma
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plataforma -d plataforma"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: plataforma-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Whisper local opcional para transcrever chamadas sem enviar áudio a uma API
  # paga. Inicie com `docker compose --profile transcricao up -d transcriber`.
  transcriber:
    profiles: ["transcricao", "webjs"]
    build:
      context: .
      dockerfile: apps/api/transcriber/Dockerfile
    restart: unless-stopped
    environment:
      TRANSCRICAO_LOCAL_MODELO: ${TRANSCRICAO_LOCAL_MODELO:-base}
      WHISPER_MODEL_DIR: /models
      WHISPER_CPU_THREADS: ${WHISPER_CPU_THREADS:-2}
    ports:
      - "127.0.0.1:3334:3334"
    volumes:
      - transcriber-models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3334/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # Ponte do WhatsApp nao oficial (Baileys). Opcional: so sobe com o perfil
  # "ponte" (`docker compose --profile ponte up -d`), porque quem usa a Cloud
  # API oficial nao precisa dela — e porque este modo viola os termos de uso do
  # WhatsApp e nao deve subir por acidente.
  ponte:
    profiles: ["ponte"]
    depends_on:
      postgres:
        condition: service_healthy
    build:
      context: .
      dockerfile: apps/ponte/Dockerfile
    container_name: plataforma-ponte
    restart: unless-stopped
    environment:
      PONTE_PORTA: 3100
      PONTE_TOKEN: ${PONTE_TOKEN:?defina PONTE_TOKEN}
      PONTE_SEGREDO: ${PONTE_SEGREDO:?defina PONTE_SEGREDO}
      PONTE_CIFRA_CHAVE: ${PONTE_CIFRA_CHAVE:?defina PONTE_CIFRA_CHAVE}
      DATABASE_URL: ${PONTE_DATABASE_URL:-postgresql://plataforma:plataforma@postgres:5432/plataforma}
      PONTE_PLATAFORMA_URL: ${PONTE_PLATAFORMA_URL:-http://host.docker.internal:3000}
      PONTE_ORGANIZACAO_ID: ${PONTE_ORGANIZACAO_ID:?defina PONTE_ORGANIZACAO_ID}
      # Como a API alcanca a ponte para baixar a midia recebida.
      PONTE_URL_PUBLICA: ${PONTE_URL_PUBLICA:-http://localhost:3100}
    ports:
      - "3100:3100"
    volumes:
      # Credenciais do pareamento. Sem volume, todo restart pede QR de novo.
      - ponte-dados:/app/dados
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/saude').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Conector WhatsApp Web.js em processo/container separado. O bind local serve
  # apenas para a API que roda no host durante desenvolvimento; Coolify usa rede
  # privada e nao publica a porta do servico.
  whatsapp-webjs:
    profiles: ["webjs"]
    depends_on:
      transcriber:
        condition: service_healthy
    build:
      context: ./experimentos/whatsapp-webjs-call-poc
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      WEBJS_HOST: 0.0.0.0
      WEBJS_LOCAL_PORT: 4174
      WEBJS_DATA_DIR: /data
      WEBJS_LOCAL_TOKEN: ${WEBJS_LOCAL_TOKEN:?defina WEBJS_LOCAL_TOKEN}
      WPP_CONNECT_WEBHOOK_SECRET: ${WPP_CONNECT_WEBHOOK_SECRET:?defina WPP_CONNECT_WEBHOOK_SECRET}
      WEBJS_INBOUND_WEBHOOK_URL: ${WEBJS_INBOUND_WEBHOOK_URL:-http://host.docker.internal:3333/api/webhooks/wppconnect}
      TRANSCRICAO_LOCAL_URL: ${TRANSCRICAO_LOCAL_URL:-http://transcriber:3334/v1/audio/transcriptions}
      TRANSCRICAO_LOCAL_MODELO: ${TRANSCRICAO_LOCAL_MODELO:-base}
      LIGACAO_IA_OLLAMA_URL: ${LIGACAO_IA_OLLAMA_URL:-http://host.docker.internal:11434}
      LIGACAO_IA_OLLAMA_MODELO: ${LIGACAO_IA_OLLAMA_MODELO:-qwen3:4b}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "127.0.0.1:4174:4174"
    volumes:
      - whatsapp-webjs-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4174/api/platform/health',{headers:{Authorization:'Bearer '+process.env.WEBJS_LOCAL_TOKEN}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  postgres-data:
  redis-data:
  ponte-dados:
  transcriber-models:
  whatsapp-webjs-data:
